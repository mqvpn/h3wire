[package]
name = "h3wire-masque"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "MASQUE CONNECT-UDP (RFC 9298), CONNECT-IP (RFC 9484) and the HTTP capsule codec (RFC 9297) over h3wire-async"
repository = "https://github.com/mqvpn/h3wire"
documentation = "https://docs.rs/h3wire-masque"
readme = "README.md"
keywords = ["masque", "http3", "quic", "connect-udp", "connect-ip"]
categories = ["network-programming", "asynchronous"]

[dependencies]
h3wire-async = { path = "../h3wire-async", version = "0.2.0" }
bytes = "1"
http = "1"
http-body = "1"
futures-core = "0.3"

[dev-dependencies]
proptest = "1"
h3wire-quinn = { path = "../h3wire-quinn", version = "0.2.0" }
h3wire-async = { path = "../h3wire-async", version = "0.2.0", features = ["tokio", "__testing"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
futures = "0.3"
http-body-util = "0.1"
tower-service = "0.3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["net"] }
tokio-tun = "1"

[[example]]
name = "proxy"
test = true

# Not `client`: h3wire-quinn's example has that name, and the outputs would collide.
[[example]]
name = "masque-client"
path = "examples/client.rs"

[[example]]
name = "ip-proxy"
test = true

[[example]]
name = "ip-client"
test = true
