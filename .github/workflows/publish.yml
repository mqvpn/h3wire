name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      crates:
        description: 'Crates to publish, space-separated (cargo orders them by dependency)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.repository == 'mqvpn/h3wire'
    runs-on: ubuntu-latest
    outputs:
      args: ${{ steps.select.outputs.args }}
    steps:
      - id: select
        env:
          CRATES: ${{ inputs.crates }}
        run: |
          set -f
          args=""
          for c in $CRATES; do
            case "$c" in
              h3wire|h3wire-async|h3wire-quinn|h3wire-masque) args="$args -p $c" ;;
              *) echo "::error::unknown crate: $c"; exit 1 ;;
            esac
          done
          [ -n "$args" ] || { echo "::error::no crates given"; exit 1; }
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.85'
      - run: cargo +1.85 build $ARGS --locked
        env:
          ARGS: ${{ steps.select.outputs.args }}
      - run: cargo +stable package $ARGS --locked
        env:
          ARGS: ${{ steps.select.outputs.args }}
      # Only the core's packaged tests run standalone: the adapters' packaged tests resolve
      # h3wire from crates.io, which differs from the local core (see ci.yml).
      - if: contains(format(' {0} ', steps.select.outputs.args), ' -p h3wire ')
        run: cargo +stable test --manifest-path target/package/h3wire-[0-9]*/Cargo.toml --locked
      - run: cargo +stable publish $ARGS --locked --dry-run
        env:
          ARGS: ${{ steps.select.outputs.args }}

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.repository == 'mqvpn/h3wire'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish $ARGS --locked
        env:
          ARGS: ${{ needs.verify.outputs.args }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
